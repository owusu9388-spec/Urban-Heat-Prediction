<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UrbanHeat Accra — Heat Risk Dashboard</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />

  <script>
    // Point the frontend at your running FastAPI backend.
    // Defaults to localhost:8000 for local development.
    window.URBANHEAT_API_BASE_URL = "http://127.0.0.1:8000";
  </script>
</head>
<body>
  <div id="app">
    <header>
      <div>
        <h1>UrbanHeat Accra</h1>
        <div class="subtitle">Urban heat-risk dashboard for city planners &mdash; relative indicator, not validated absolute measurement</div>
      </div>
    </header>

    <aside id="sidebar">
      <div class="section-title">Filter by risk category</div>
      <div class="filter-chip-row" id="filter-chips"></div>

      <div class="section-title">Locations</div>
      <ul class="location-list" id="location-list">
        <div class="loading-text">Loading locations…</div>
      </ul>
    </aside>

    <div id="map-container">
      <div id="map"></div>
      <div id="detail-drawer"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <script src="js/api.js"></script>
  <script src="js/map.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
